<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kipps Coffe</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="Images/Logo.jfif" type="image/x-icon" />
</head>

<body>
    <div class="hero-section">
        <img src="Images/Logo-removebg-preview.png" alt="Logo" class="logo" />
        <h1 class="kc-h1">Kipps Coffee</h1>
        <div class="randomcircles">
            <div class="circle1"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
            <div class="circle4"></div>
            <div class="circle5"></div>
            <div class="circle6"></div>
        </div>

        <a href="#" class="orderNow">Order now →</a>
        <p class="cwp">...crafted with precision</p>
    </div>
    <div class="section2">
        <h1 class="options-text">Options</h1>
        <hr class="section2hr" />

        <div class="options">
            <div class="optionimg image1">Cappuccino</div>
            <div class="optionimg image2">Espresso</div>
            <div class="optionimg image3">Americano</div>
            <div class="optionimg image1">Cappuccino</div>
            <div class="optionimg image2">Espresso</div>
            <div class="optionimg image3">Americano</div>
        </div>
    </div>
    <!-- Location -->
    <div class="section3">
        <p class="location-txt">Locations</p>
        <hr class="location-underline" />
        <!-- location1 -->
        <div class="location1">
            <div class="locationimg1">
                Lagos
                <div class="address1">Address</div>
            </div>
        </div>
        <!-- location2 -->
        <div class="location2">
            <div class="locationimg2">
                Abuja
                <div class="address2">Address</div>
            </div>
        </div>
    </div>
    <div class="footer">
        <h1>Thank you for your patronage</h1>
        <h4>© 2026 Kipps Inc. All rights reserved.
</h4>
    </div>
</body>

</html>
